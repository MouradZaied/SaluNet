[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salunet"
version = "0.1.0"
description = "Batch-statistics-free signal control and learnable gating for convolutional and vision transformer networks."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Mourad Zaied"}
]
keywords = [
    "deep-learning",
    "computer-vision",
    "normalization-free",
    "batch-size-robustness",
    "resnet",
    "vision-transformer",
    "pytorch-lightning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "pytorch-lightning>=2.6,<3",
    "torchmetrics>=1.8,<2",
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "PyYAML>=6,<7",
    "wandb>=0.26,<1",
    "rich>=10.2,<15"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10"
]

[project.urls]
Repository = "https://github.com/MouradZaied/SaluNet"
Issues = "https://github.com/MouradZaied/SaluNet/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["salunet*"]

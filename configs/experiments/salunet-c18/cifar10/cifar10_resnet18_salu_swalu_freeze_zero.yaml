experiment_name: cifar10_resnet18_salu_swalu_freeze_zero
seed: 142
deterministic: false
num_classes: 10
epochs: 300
data:
  name: cifar10
  data_dir: ./data
  batch_size: 512
  num_workers: 12
  use_auto_augment: true
  use_rand_augment: false
  use_cutout: true
  cutout_n_holes: 1
  cutout_length: 16
  cutout_p: 0.5
  fallback_aug: false
model:
  name: resnet18
  dataset_style: cifar
  pretrained: false
  compile_model: true
  dropout_rate: 0.3
  family: cnn
  drop_path_rate: 0.005
  drop_path_scale_by_keep: true
  drop_path_reverse: true
  channels_last: false
signal_control:
  type: salu
activation:
  type: swalu
  a_init: 1.0
  b_init: 1.0
  positivity: abs
salu:
  positivity: exp_log
  a_init: 1.0
  b_init: 0.1
initialization:
  type: default
  a: 1.0
  apply_to:
    conv: true
    linear: true
loss:
  label_smoothing: 0.01
optimizer:
  lr: 0.3
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: true
  signal_lr_factor: 2.0
  signal_weight_decay: 0.0
scheduler:
  warmup_epochs: 5
  min_lr: 0.0001
  cosine_decay_factor: 1.2
  signal:
    decay_factor: 1.2
    after_min: freeze_zero
mix:
  mixup_alpha: 0.1
  cutmix_alpha: 1.0
  mix_prob: 0.7
  use_cutmix: true
  ramp_epochs: 10
  progressive: true
ema:
  use_ema: true
  evaluate_on_validation: true
  log_prefix: val_ema
  decay: 0.999
checkpoint:
  save_checkpoints: true
  save_dir: ./checkpoints/cifar10_resnet18_salu_swalu_freeze_zero
  save_raw_best: true
  save_ema_best: true
  save_last: true
  raw_monitor: val/acc
  raw_mode: max
  ema_monitor: val_ema/acc
  ema_mode: max
  raw_filename: best_mp_model.pth
  ema_filename: best_ema_model.pth
  last_filename: last.ckpt
trainer:
  accelerator: auto
  devices: auto
  precision: 16-mixed
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  allow_tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  fast_dev_run: false
logging:
  log_every_n_steps: 50
  wandb:
    enabled: true
    project: salunet-c18-cifar10
    entity: null
    name: cifar10_resnet18_salu_swalu_freeze_zero
    tags:
    - cifar10
    - resnet18
    - salu
    - swalu
    - ema
    - tested-source
    - drop_path_0.005
    log_model: false
    offline: false
  tensorboard:
    enabled: false
    save_dir: logs/tensorboard
  csv:
    enabled: true
    save_dir: logs/csv
  diagnostics:
    enabled: true
    every_n_steps: 100
    max_modules: 16
    log_grad_norm_x: true
    log_grad_norm_ab: true
    log_variance: true
  learning_rate:
    enabled: true
    logging_interval: step
    log_momentum: true
  epoch_timer:
    enabled: true
gpu_optimizations:
  enabled: true
  cuda_launch_blocking: '0'
  torch_cudnn_v8_api_enabled: '1'
  pytorch_cuda_alloc_conf: max_split_size_mb:512
  cublas_workspace_config: :4096:8

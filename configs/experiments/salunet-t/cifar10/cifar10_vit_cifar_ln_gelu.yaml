experiment_name: cifar10_vit_cifar_ln_gelu
seed: 1234
deterministic: false
num_classes: 10
epochs: 200
data:
  name: cifar10
  recipe: vit_cifar
  data_dir: ./data
  batch_size: 128
  val_batch_size: 1024
  num_workers: 4
  use_auto_augment: true
  use_rand_augment: false
  use_cutout: false
model:
  name: vit_cifar
  image_size: 32
  patches_per_axis: 8
  hidden: 384
  mlp_hidden: 384
  heads: 12
  layers: 7
  dropout: 0.0
  class_token: true
  dyt_alpha_init: 0.5
  compile_model: true
  compile_mode: default
signal_control:
  type: ln
  a_init: 1.0
  b_init: 0.1
  positivity: exp_log
activation:
  type: gelu
  a_init: 1.0
  b_init: 1.0
  positivity: abs_eps_legacy
loss:
  label_smoothing: 0.1
optimizer:
  name: adam
  lr: 0.0005
  weight_decay: 5.0e-05
  signal_lr_factor: 0.1
  signal_weight_decay: 0.0
scheduler:
  name: vit_epoch_cosine
  warmup_epochs: 5
  min_lr: 1.0e-05
  signal_min_lr: 1.0e-06
  signal_decay_factor: 1.0
mix:
  mix_prob: 0.0
ema:
  use_ema: true
  decay: 0.9999
  evaluate_on_validation: true
checkpoint:
  save_checkpoints: true
  save_dir: ./checkpoints/cifar10_vit_cifar_ln_gelu
  monitor: val_ema/acc
  save_raw_best: true
  save_ema_best: true
  save_last: true
trainer:
  accelerator: auto
  devices: 1
  precision: 16-mixed
  accumulate_grad_batches: 1
  gradient_clip_val: 0.0
  allow_tf32: true
  cudnn_benchmark: true
  matmul_precision: medium
  fast_dev_run: false
logging:
  log_every_n_steps: 50
  wandb:
    enabled: true
    project: salunet-t-cifar10
    log_model: false
    offline: false
  csv:
    enabled: true
    save_dir: logs/csv
  tensorboard:
    enabled: false
  diagnostics:
    enabled: false
